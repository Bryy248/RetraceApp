name: Retrace
options:
  bundleIdPrefix: com.Brian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: BPKZ3792AR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Retrace:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Retrace

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Brian.Retrace
        GENERATE_INFOPLIST_FILE: "NO"      # penting: cegah plist ganda
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

    info:
      path: Retrace/Info.plist
      properties:
        # --- bawaan yang tadinya di-generate otomatis ---
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # --- izin lokasi (Story C) ---
        NSLocationWhenInUseUsageDescription: "Retrace merekam perjalananmu untuk membuat video rekap. Data lokasi hanya disimpan di perangkatmu, tidak dikirim ke mana pun."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Retrace merekam perjalananmu (termasuk di latar belakang) untuk membuat video rekap. Data lokasi hanya disimpan di perangkatmu, tidak dikirim ke mana pun."
        UIBackgroundModes:
          - location
